# Local Postgres for development and DB integration tests. Major version matches Supabase
# (PostgreSQL 17). Host port 5433 so it can run beside other local projects on 5432.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: fortuna
      POSTGRES_PASSWORD: fortuna
      POSTGRES_DB: fortuna
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fortuna -d fortuna"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  db-data:
